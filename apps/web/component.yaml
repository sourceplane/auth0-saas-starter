apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The B2B SaaS — sign-up into an organization, members and roles, SSO and security policies, all in an Auth0 tenant (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # No dependsOn: the site reads no wiring and binds nothing, so there is no
  # infra component to deploy before it.
  #
  # The Auth0 tenant's configuration for this environment, stored as the
  # product's secrets by the tenant bootstrap (`pnpm auth0:bootstrap --env
  # <env>`, tooling/auth0/bootstrap.mjs; README → Connect Auth0): the
  # tenant's domain, the two applications' credentials, the role ids, the
  # shared connection's id, the claims namespace and a generated session
  # secret (AUTH0_MANAGEMENT_API_DOMAIN only when the tenant uses a custom
  # domain). The domain is inlined by `next build`; everything else is read
  # by the Worker at request time, so the build hands it to the Worker as
  # Worker secrets and no bundle contains it (buildCommand below).
  # BEST-EFFORT references, wire-now-seed-later: a key nobody has stored yet
  # is skipped when the job resolves its secrets (no env var, no failure),
  # and a build without the whole set is the site with a "connect Auth0"
  # notice where sign-up would be — so a fresh product deploys and serves
  # before its owner has a tenant at all.
  optionalSecretEnv:
    AUTH0_DOMAIN: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_DOMAIN"
    AUTH0_MANAGEMENT_API_DOMAIN: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_MANAGEMENT_API_DOMAIN"
    AUTH0_CLIENT_ID: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_CLIENT_ID"
    AUTH0_CLIENT_SECRET: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_CLIENT_SECRET"
    AUTH0_MANAGEMENT_CLIENT_ID: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_MANAGEMENT_CLIENT_ID"
    AUTH0_MANAGEMENT_CLIENT_SECRET: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_MANAGEMENT_CLIENT_SECRET"
    SESSION_ENCRYPTION_SECRET: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/SESSION_ENCRYPTION_SECRET"
    AUTH0_ADMIN_ROLE_ID: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_ADMIN_ROLE_ID"
    AUTH0_MEMBER_ROLE_ID: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/AUTH0_MEMBER_ROLE_ID"
    DEFAULT_CONNECTION_ID: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/DEFAULT_CONNECTION_ID"
    CUSTOM_CLAIMS_NAMESPACE: "secret://auth0-saas-starter/auth0-saas-starter/{{ .environment }}/CUSTOM_CLAIMS_NAMESPACE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: auth0-saas-starter-web-{dev,stage,prod}.
    workerName: auth0-saas-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # The site's public origin — Auth0's appBaseUrl (its callback and logout
    # URLs) and metadataBase: the environment's SITE_URL when intent.yaml
    # sets one (a custom domain), else its workers.dev URL. The subdomain is
    # written out rather than read from ${WORKERS_DEV_SUBDOMAIN}: the
    # composition exports that to the smoke step only, so the build would see
    # it empty. ${ORUN_ENVIRONMENT} the runner sets for every step.
    #
    # The tenant's configuration never reaches the build but its domain:
    # `next build` is told only that the rest EXISTS (AUTH0_CONFIGURED, "true"
    # when every value is set — next.config.ts) and runs without it (`env
    # -u`), so neither a bundle nor the bundler's cache holds a credential.
    # Then every value the environment has goes to the Worker as a SECRET
    # (tooling/wire/worker-secrets.mjs: `wrangler secret bulk`, the values
    # over stdin) before the composition deploys it. Only the deploy lane
    # holds a Cloudflare credential, so a verify lane builds the same and
    # pushes nothing.
    buildCommand: AUTH0_CONFIGURED="${AUTH0_CLIENT_ID:+${AUTH0_CLIENT_SECRET:+${AUTH0_MANAGEMENT_CLIENT_ID:+${AUTH0_MANAGEMENT_CLIENT_SECRET:+${SESSION_ENCRYPTION_SECRET:+${AUTH0_ADMIN_ROLE_ID:+${AUTH0_MEMBER_ROLE_ID:+${DEFAULT_CONNECTION_ID:+${CUSTOM_CLAIMS_NAMESPACE:+true}}}}}}}}}" NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://auth0-saas-starter-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" env -u AUTH0_CLIENT_ID -u AUTH0_CLIENT_SECRET -u AUTH0_MANAGEMENT_CLIENT_ID -u AUTH0_MANAGEMENT_CLIENT_SECRET -u SESSION_ENCRYPTION_SECRET -u AUTH0_ADMIN_ROLE_ID -u AUTH0_MEMBER_ROLE_ID -u DEFAULT_CONNECTION_ID -u CUSTOM_CLAIMS_NAMESPACE pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --worker "auth0-saas-starter-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc --secret AUTH0_DOMAIN --secret AUTH0_MANAGEMENT_API_DOMAIN --secret AUTH0_CLIENT_ID --secret AUTH0_CLIENT_SECRET --secret AUTH0_MANAGEMENT_CLIENT_ID --secret AUTH0_MANAGEMENT_CLIENT_SECRET --secret SESSION_ENCRYPTION_SECRET --secret AUTH0_ADMIN_ROLE_ID --secret AUTH0_MEMBER_ROLE_ID --secret DEFAULT_CONNECTION_ID --secret CUSTOM_CLAIMS_NAMESPACE

    # Smoke: the home page renders to its end (`</html>` — a render that
    # throws partway through a streamed page still sent a 200), whether or not
    # Auth0 is connected; and /api/health answers ok — the Worker holds what
    # its build expects (every secret of the tenant's configuration when the
    # build had it, nothing when it did not). Each response is buffered before grep so an
    # early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
